name: MoonVCR CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: moon version --all

      - name: Resolve locked dependency graph
        run: |
          moon update
          moon tree

      - name: Check
        run: moon check

      - name: Build
        run: moon build

      - name: Test
        run: moon test

      - name: Capacity acceptance with resource report
        run: /usr/bin/time -v moon test --target wasm capacity_test.mbt --serial

      - name: Formatting
        run: moon fmt --check

      - name: Offline example
        run: moon run cmd/moonvcr-demo

      - name: Business scenario acceptance
        run: |
          moon run cmd/moonvcr-pagination
          moon run cmd/moonvcr-order-contract
          moon run cmd/moonvcr-restricted-ci

      - name: Failure scenarios must exit nonzero
        shell: bash
        run: |
          set -euo pipefail
          for scenario in \
            cmd/moonvcr-pagination-failure \
            cmd/moonvcr-order-contract-failure \
            cmd/moonvcr-restricted-ci-failure
          do
            if moon run "$scenario"; then
              echo "$scenario unexpectedly succeeded"
              exit 1
            fi
            echo "$scenario failed as expected"
          done

      - name: Package manifest
        run: moon package --list

  native:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: moon version --all

      - name: Resolve locked dependency graph
        run: |
          moon update
          moon tree

      - name: Check native packages
        run: moon check --target native

      - name: Build native packages
        run: moon build --target native

      - name: Run native tests
        run: moon test --target native --serial

      - name: Run loopback HTTP and cross-process replay acceptance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _build
          moon run --target native cmd/moonvcr-loopback-server > _build/loopback-server.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 1 http://127.0.0.1:38081/health >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat _build/loopback-server.log
            exit 1
          fi

          moon run --target native cmd/moonvcr-native-http-acceptance
          moon run --target native cmd/moonvcr-native-record

          cleanup
          trap - EXIT
          if curl -fsS --max-time 1 http://127.0.0.1:38081/health >/dev/null 2>&1; then
            echo "loopback server is still reachable after shutdown"
            exit 1
          fi
          moon run --target native cmd/moonvcr-native-replay
