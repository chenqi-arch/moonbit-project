name: MoonVCR CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: moon version --all

      - name: Check
        run: moon check

      - name: Build
        run: moon build

      - name: Test
        run: moon test

      - name: Formatting
        run: moon fmt --check

      - name: Offline example
        run: moon run cmd/moonvcr-demo

      - name: Package manifest
        run: moon package --list

  native:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Verify native package shape
        run: moon check --target native

      - name: Build native packages
        run: moon build --target native

      - name: Run native tests
        run: moon test --target native

      - name: Run native archive demo
        run: moon run --target native cmd/moonvcr-native-demo

      - name: Run cross-process record step
        run: moon run --target native cmd/moonvcr-native-record

      - name: Run cross-process offline replay step
        run: moon run --target native cmd/moonvcr-native-replay
